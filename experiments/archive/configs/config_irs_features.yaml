# Exp 2 (code lever): baseline climate + dense IRS features engineered in model
# code from the raw irs_allocated column (see mstl_multistep/irs_features.py).
# Raw irs_allocated is intentionally NOT in additional_continuous_covariates —
# the engineered level/decay/since/cumulative features replace it.
additional_continuous_covariates:
  - rainfall_era5
  - mean_temperature
  - relative_humidity
user_option_values:
  prob_model: rf_residual
  target_variable: disease_cases
  log_transform: true
  season_length_monthly: 12
  n_samples: 100
  feature_min_lag: 1
  feature_max_lag: 3
  deseasonalize_covariates:
    - rainfall_era5
    - mean_temperature
    - relative_humidity
  irs_column: irs_allocated
  irs_features: [level, decay, since, cumulative]
  irs_halflife: 4.0
  arima_stepwise: true
  arima_approximation: true
  arima_level: 68
  rf:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 5
    max_features: sqrt
    random_state: 42
