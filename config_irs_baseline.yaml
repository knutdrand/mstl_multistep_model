# Frozen baseline for the irs_allocated session: rf_residual + deseasonalized
# climate only (NO IRS signal). Everything in this session is measured against
# this so the irs_allocated feature-extraction gain is isolated.
additional_continuous_covariates:
  - rainfall_era5
  - mean_temperature
  - relative_humidity
user_option_values:
  prob_model: rf_residual
  target_variable: disease_cases
  log_transform: true
  season_length_monthly: 12
  n_samples: 100
  feature_min_lag: 1
  feature_max_lag: 3
  deseasonalize_covariates:
    - rainfall_era5
    - mean_temperature
    - relative_humidity
  arima_stepwise: true
  arima_approximation: true         # 406 locations -> speed up AutoARIMA
  arima_level: 68
  rf:
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 5
    max_features: sqrt
    random_state: 42
