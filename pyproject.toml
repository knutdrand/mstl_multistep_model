[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mstl_multistep_model"
version = "0.1.1"
description = "MSTL decomposition with a simple recursive multistep model as the trend/remainder forecaster, for CHAP"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scikit-learn",
    "statsforecast>=1.7",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["mstl_multistep"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runs", "output", ".venv"]
