[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mstl_multistep_model"
version = "0.1.1"
description = "MSTL decomposition with a simple recursive multistep model as the trend/remainder forecaster, for CHAP"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scikit-learn",
    "skpro",
    "statsforecast>=1.7",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "mapie>=1.3.0",
    "simple_multistep_model",
]

[tool.uv.sources]
# The trend model is reused verbatim from the sibling repo, pinned to an exact
# commit for reproducibility. A git source (rather than a local path) is what
# makes this repo clonable by others and survives `chap eval` copying the project
# into a `runs/<ts>/` subdir (a relative path source would break there).
simple_multistep_model = { git = "https://github.com/knutdrand/simple_multistep_model", rev = "719e7aee8495590600c3b9812eb446de35218e37" }

[tool.hatch.build.targets.wheel]
packages = ["mstl_multistep"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["runs", "output", ".venv"]
