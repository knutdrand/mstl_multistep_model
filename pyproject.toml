[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mstl_multistep_model"
version = "0.1.0"
description = "MSTL decomposition with a simple recursive multistep model as the trend/remainder forecaster, for CHAP"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scikit-learn",
    "skpro",
    "statsforecast>=1.7",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "mapie>=1.3.0",
    "simple_multistep_model",
]

[tool.uv.sources]
# The trend model is reused verbatim from the sibling repo. An ABSOLUTE path is
# required because `chap eval` copies this project into a `runs/<ts>/` subdir and
# runs uv from there, which would break a relative `../` source. Collaborators
# should point this at their own checkout of simple_multistep_model.
simple_multistep_model = { path = "/Users/knutdr/Sources/simple_multistep_model", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["mstl_multistep"]

[dependency-groups]
dev = [
    "pytest>=8",
]
